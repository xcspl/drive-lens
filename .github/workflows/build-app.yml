# Builds the desktop app on each kind of machine (native modules don't
# cross-compile) and, for a v* tag, publishes the files as a GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
# Run by hand from the Actions tab to build without releasing.
name: Build app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The query model (331 MB) is pinned to one revision in fetch-model.mjs.
      - uses: actions/cache@v4
        with:
          path: app/models
          key: query-model-${{ hashFiles('app/scripts/fetch-model.mjs') }}

      - run: npm ci

      - name: Build and package
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds

      - uses: actions/upload-artifact@v4
        with:
          name: drive-lens-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "Drive Lens ${GITHUB_REF_NAME}" --generate-notes
